<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca | Empresa X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Estilos minimalistas adicionales */
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { border-bottom: 1px solid #dee2e6; }
        .btn, .card, .form-control, .table { border-radius: 0 !important; } /* Quitar bordes redondos */
        .header-section { background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 40px 0; }
        .table thead { background-color: #212529; color: #ffffff; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BIBLIOTECA X</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/">Inicio</a>
                <a class="nav-link" href="/contact">Contacto</a>
            </div>
        </div>
    </nav>

    <header class="header-section mb-5">
        <div class="container">
            <h1 class="display-5 fw-light">Inventario de Libros</h1>
            <p class="text-muted">Gestión de recursos bibliográficos en tiempo real mediante arquitectura Event-Driven. [cite: 74, 75]</p>
        </div>
    </header>

    <main class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">Listado General</h2>
            <button id="btn-refresh" class="btn btn-dark px-4">Actualizar Catálogo</button>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="border-0">ID</th>
                            <th class="border-0">Título</th>
                            <th class="border-0">Autor</th>
                            <th class="border-0">Estado</th>
                            <th class="border-0">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-libros">
                        <tr>
                            <td colspan="5" class="text-center py-5 text-muted">
                                Cargando inventario...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="container py-5 mt-5 border-top text-center text-muted small">
        &copy; 2026 Universidad Don Bosco - Investigación Aplicada 2. [cite: 1, 2]
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lógica básica para conectar con tu ruta /data más adelante
        document.getElementById('btn-refresh').addEventListener('click', () => {
            fetch('/data')
                .then(response => response.json())
                .then(data => {
                    console.log("Datos recibidos:", data);
                    // Aquí el Dev B y tú integrarán el llenado de la tabla [cite: 114]
                })
                .catch(err => console.error("Error al cargar datos:", err));
        });
    </script>
</body>
</html>

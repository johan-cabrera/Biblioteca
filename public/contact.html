<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Biblioteca Empresa X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar { border-bottom: 1px solid #dee2e6; }
        .btn, .card, .form-control { border-radius: 0 !important; }
        .header-section { background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 40px 0; }
        .form-label { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; color: #495057; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BIBLIOTECA X</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link active" href="/contact">Contacto</a>
            </div>
        </div>
    </nav>

    <header class="header-section mb-5">
        <div class="container text-center">
            <h1 class="display-5 fw-light">Contacto</h1>
            <p class="text-muted">¿No encuentras un libro? Envíanos una sugerencia o consulta.</p>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <form id="contact-form" action="/contact" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control bg-light" id="nombre" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control bg-light" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título del libro solicitado</label>
                            <input type="text" class="form-control bg-light" id="titulo" name="titulo" required>
                        </div>
                        <div class="mb-3">
                            <label for="autor" class="form-label">Autor (si lo conoces)</label>
                            <input type="text" class="form-control bg-light" id="autor" name="autor">
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje o Información adicional</label>
                            <textarea class="form-control bg-light" id="mensaje" name="mensaje" rows="4"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark py-2 text-uppercase">Enviar Solicitud</button>
                        </div>
                    </form>
                    <div id="response-msg" class="mt-3 text-center d-none"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container py-5 mt-5 border-top text-center text-muted small">
        &copy; 2026 Universidad Don Bosco - Investigación Aplicada 2.
    </footer>

    <script>
        const form = document.getElementById('contact-form');
        const msgDiv = document.getElementById('response-msg');
        const showMessage = (text, error = false) => {
            msgDiv.className = `mt-3 text-center alert ${error ? 'alert-danger' : 'alert-success'} border-0 rounded-0`;
            msgDiv.textContent = text;
            msgDiv.classList.remove('d-none');
        };

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());
            try {
                const res = await fetch('/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const body = await res.json();
                if (!res.ok || body.error) {
                    return showMessage(body.error || 'No se pudo enviar la solicitud.', true);
                }
                showMessage('Solicitud enviada con éxito. Gracias por contactarnos.');
                form.reset();
            } catch (err) {
                console.error(err);
                showMessage('No se pudo enviar la solicitud. Intenta nuevamente más tarde.', true);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Biblioteca Empresa X</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .navbar { border-bottom: 1px solid #dee2e6; }
        .btn, .card, .form-control { border-radius: 0 !important; }
        .header-section { background: #ffffff; border-bottom: 1px solid #dee2e6; padding: 40px 0; }
        .form-label { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; color: #495057; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">BIBLIOTECA X</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link active" href="/contact">Contacto</a>
            </div>
        </div>
    </nav>

    <header class="header-section mb-5">
        <div class="container text-center">
            <h1 class="display-5 fw-light">Contacto</h1>
            <p class="text-muted">¿No encuentras un libro? Envíanos una sugerencia o consulta.</p>
        </div>
    </header>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <form id="contact-form" action="/contact" method="POST">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control bg-light" id="nombre" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control bg-light" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje o Sugerencia</label>
                            <textarea class="form-control bg-light" id="mensaje" name="mensaje" rows="4" required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark py-2 text-uppercase">Enviar Mensaje</button>
                        </div>
                    </form>
                    <div id="response-msg" class="mt-3 text-center d-none"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container py-5 mt-5 border-top text-center text-muted small">
        &copy; 2026 Universidad Don Bosco - Investigación Aplicada 2.
    </footer>

    <script>
        // Opcional: Manejar el envío vía AJAX para que sea 100% Event-Driven en el frontend
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            fetch('/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                const msgDiv = document.getElementById('response-msg');
                msgDiv.className = "mt-3 text-center alert alert-success border-0 rounded-0";
                msgDiv.textContent = "Mensaje enviado con éxito.";
                msgDiv.classList.remove('d-none');
                this.reset();
            })
            .catch(err => console.error("Error:", err));
        });
    </script>
</body>
</html>
